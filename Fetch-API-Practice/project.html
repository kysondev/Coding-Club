<!DOCTYPE html>
<html>
  <head>
    <title>Project - Profile Finder</title>
    <style>
      body {
        font-family: Arial;
        padding: 40px;
        background: #f9f9f9;
      }
      .search-area {
        max-width: 400px;
        margin: 0 auto 40px auto;
        text-align: center;
      }
      input {
        padding: 10px;
        width: 100px;
        border: 1px solid black;
      }
      button {
        padding: 10px 20px;
        background: black;
        color: white;
        border: none;
        cursor: pointer;
      }
      #profile-card {
        max-width: 400px;
        margin: auto;
        border: 2px solid black;
        background: white;
        padding: 30px;
        display: none; /* Hidden until search */
      }
      #avatar {
        width: 120px;
        height: 120px;
        border: 1px solid #ccc;
        display: block;
        margin: 0 auto 20px auto;
      }
      .data-row {
        margin-bottom: 10px;
        border-bottom: 1px solid #eee;
        padding-bottom: 5px;
      }
      .label {
        font-weight: bold;
        text-transform: uppercase;
        font-size: 12px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="search-area">
      <h1>Profile Finder</h1>
      <p>Enter User ID (1-10)</p>
      <input type="number" id="user-id" min="1" max="10" />
      <button id="search-btn">Search</button>
    </div>

    <div id="profile-card">
      <img id="avatar" src="" alt="Profile" />
      <h2 id="name" style="text-align: center; margin-top: 0;"></h2>
      
      <div class="data-row">
        <div class="label">Username</div>
        <div id="username"></div>
      </div>
      <div class="data-row">
        <div class="label">Email</div>
        <div id="email"></div>
      </div>
      <div class="data-row">
        <div class="label">City</div>
        <div id="city"></div>
      </div>
    </div>

    <script>
      /******************************************

      2. Fetch user from: `https://jsonplaceholder.typicode.com/users/${id}`
      3. Update the UI fields
      4. Set #avatar to: `https://robohash.org/${id}?set=set4`
      5. Show #profile-card
    ******************************************/
    </script>
  </body>
</html>
